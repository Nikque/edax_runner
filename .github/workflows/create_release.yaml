---
name: Create Release

# Run by hand (Actions > Create Release > Run workflow, on the default branch nikque-fixes).
# The version comes from pubspec.yaml: "5.3.0+nikque.2" makes the tag "v5.3.0-nikque.2".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Stop if the release of this version already exists:
  # otherwise its files would be replaced, while its tag stays on the old commit.
  # (to create it again on purpose, delete the release and the tag first)
  check_tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: stop if the tag of the version already exists
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v${VERSION/+/-}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::the tag $TAG already exists. Update the version of pubspec.yaml."
            exit 1
          fi
          echo "the tag $TAG doesn't exist yet."

  build:
    needs: check_tag
    runs-on: ${{ matrix.runner_machine }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include: # See: https://docs.github.com/ja/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#using-environment-variables-in-a-matrix
          - os: ubuntu-latest
            runner_machine: ubuntu-latest
            edax_runner_bin_name: edax_runner
            libedax_shared_library_pattern: "libedax*.so"
          - os: windows-latest
            runner_machine: windows-latest
            edax_runner_bin_name: edax_runner.exe
            libedax_shared_library_pattern: "libedax-x64*.dll"
          - os: macos-latest # apple silicon
            # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
            runner_machine: macos-latest
            edax_runner_bin_name: edax_runner
            libedax_shared_library_pattern: libedax.universal.dylib

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.1
      - name: install dependencies
        run: dart pub get

      - name: build edax_runner
        shell: bash
        run: ./scripts/build_edax_runner.sh ${{ matrix.edax_runner_bin_name }} "${{ matrix.libedax_shared_library_pattern }}"

      - name: create directory for publish
        shell: bash
        run: cp -R build edax_runner

      - name: output build info
        shell: bash
        run: .github/scripts/output_build_info.sh edax_runner

      - name: get the tag from the version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=v${VERSION/+/-}" >> "$GITHUB_OUTPUT"

      - name: compress files (Windows)
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path edax_runner -DestinationPath edax_runner-${{ matrix.os }}.zip
      - name: compress files (Linux, MacOS)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: zip -r edax_runner-${{ matrix.os }}.zip edax_runner

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: edax_runner-${{ matrix.os }}
          path: edax_runner-${{ matrix.os }}.zip

  create_release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/edax_runner-*/*.zip
          generate_release_notes: true
