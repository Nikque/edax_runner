name: macOS libedax PGO candidate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: arm64, runner: macos-15 }
          - { arch: x86_64, target: x64-modern, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Nikque/edax-reversi-AVX
          ref: 4d16210cc91bb99fddaa372dceef8e2ca8990bfc
          path: edax
          sparse-checkout: |
            /src/
            /include/
            /tests/libedax_test.c
            /tests/check-build-paths.py
            /bin/data/eval.dat
          sparse-checkout-cone-mode: false
      - name: Train and test a native macOS library
        env:
          ABI: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          bash .github/scripts/mac_libedax_pgo.sh "$ABI" "$TARGET"
          test -s dist/libedax.universal.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libedax-pgo-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  universal:
    needs: slice
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libedax-pgo-*
          path: slices
      - name: Join and verify both library slices
        run: |
          mkdir -p dist dist/evidence
          ARM=slices/libedax-pgo-arm64
          INTEL=slices/libedax-pgo-x86_64
          for arch in arm64 x86_64; do
            input="slices/libedax-pgo-$arch"
            (cd "$input" && shasum -a 256 -c SHA256SUMS)
            cp -R "$input/evidence" "dist/evidence/$arch"
          done
          lipo -create "$ARM/libedax.universal.dylib" "$INTEL/libedax.universal.dylib" -output dist/libedax.universal.dylib
          lipo -verify_arch arm64 x86_64 dist/libedax.universal.dylib
          test "$(lipo -archs dist/libedax.universal.dylib | wc -w | tr -d ' ')" = 2
          for arch in arm64 x86_64; do
            lipo -thin "$arch" dist/libedax.universal.dylib -output "$RUNNER_TEMP/libedax-$arch.dylib"
            cmp "$RUNNER_TEMP/libedax-$arch.dylib" "slices/libedax-pgo-$arch/libedax.universal.dylib"
          done
          lipo -info dist/libedax.universal.dylib | tee dist/evidence/lipo.txt
          otool -arch all -D dist/libedax.universal.dylib | tee dist/evidence/install-names.txt
          (cd dist && shasum -a 256 libedax.universal.dylib | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: libedax-pgo-universal
          path: dist/
          if-no-files-found: error
