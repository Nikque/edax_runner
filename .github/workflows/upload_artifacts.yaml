---
name: Upload Artifacts

on:
  pull_request:
  push:
    branches:
      - nikque-fixes
  workflow_dispatch:
    inputs:
      linux_libedax_pgo:
        description: Build and verify the three Linux libedax PGO libraries
        type: boolean
        default: false

jobs:
  upload_artifacts:
    if: inputs.linux_libedax_pgo != true
    runs-on: ${{ matrix.runner_machine }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include: # See: https://docs.github.com/ja/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#using-environment-variables-in-a-matrix
          - os: ubuntu-latest
            runner_machine: ubuntu-latest
            edax_runner_bin_name: edax_runner
            libedax_shared_library_pattern: "libedax*.so"
          - os: windows-latest
            runner_machine: windows-latest
            edax_runner_bin_name: edax_runner.exe
            libedax_shared_library_pattern: "libedax-x64*.dll"
          - os: macos-latest # apple silicon
            # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
            runner_machine: macos-15 # (macos-latest kept the jobs waiting; the ZIP name keeps "macos-latest")
            edax_runner_bin_name: edax_runner
            libedax_shared_library_pattern: libedax.universal.dylib

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.1
      - name: install dependencies
        run: dart pub get

      - name: build edax_runner
        shell: bash
        run: ./scripts/build_edax_runner.sh ${{ matrix.edax_runner_bin_name }} "${{ matrix.libedax_shared_library_pattern }}"

      - name: output build info
        shell: bash
        run: .github/scripts/output_build_info.sh build

      # See: https://github.com/actions/upload-artifact/issues/38
      # Workaround: https://github.com/actions/upload-artifact#maintaining-file-permissions-and-case-sensitive-files
      - name: tar files
        run: tar -cvf ${{ runner.os }}.tar build

      - uses: actions/upload-artifact@v7
        with:
          name: edax_runner-artifacts ${{ matrix.os }}
          path: build

  linux_libedax_pgo:
    if: inputs.linux_libedax_pgo == true
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Nikque/edax-reversi-AVX
          ref: 4d16210cc91bb99fddaa372dceef8e2ca8990bfc
          path: engine
      - name: Train each shared library through libedax
        run: bash .github/scripts/build_linux_libedax_pgo.sh engine linux-pgo
      - uses: actions/upload-artifact@v4
        with:
          name: runner-linux-libedax-pgo
          path: linux-pgo/
          if-no-files-found: error
